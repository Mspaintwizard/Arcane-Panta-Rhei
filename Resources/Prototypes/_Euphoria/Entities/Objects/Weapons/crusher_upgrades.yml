# magmite nad glaicate crusher vairant upgrades here
- type: entity
  parent: [WeaponCrusher, BaseSecurityCargoContraband]
  id: WeaponCrusherMagmite
  name: magmite crusher
  description: A Crusher that has a diamond reinforced handle and a Magmite infused blade.
  components:
  - type: Sprite
    sprite: _Euphoria/Objects/Weapons/Crusher/magmite.rsi
    state: icon
  - type: Item
    size: Ginormous
    sprite: _Euphoria/Objects/Weapons/Crusher/magmite.rsi
  # Basically a crusher but better
  - type: MeleeWeapon
    range: 2.2
    damage:
      types:
        Slash: 6 # boost damage a little bit
        Blunt: 11
        Heat: 3
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 4
        Slash: 4
        Heat: 4
        Structural: 35 # upgrade so give it a little more dmg
  - type: Clothing
    sprite: _Euphoria/Objects/Weapons/Crusher/magmite.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Construction
    graph: MagmiteCrusher
    node: magmitecrusher
  - type: Tag
    tags:
    - Pickaxe # we have to override the tags of the crusher so we don't get into an upgrade loop

