- type: entity
  parent: FoodSnackBase
  id: FoodSnackTopTartBase
  abstract: true
  components:
  - type: FlavorProfile
    flavors:
    - sweet
  - type: Sprite
    sprite: _Euphoria/Objects/Consumable/Food/toptart.rsi
    state: toptart_strawberry_raw
  - type: Tag
    tags:
    - FoodSnack
    - Fruit
    - TopTart
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 12
        reagents:
        - ReagentId: Nutriment
          Quantity: 3
        - ReagentId: StrawberrySyrup
          Quantity: 2

